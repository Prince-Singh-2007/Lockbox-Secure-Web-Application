{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}

<section class="auth">

    <small>WELCOME BACK</small>

    <h1>
        Sign in to<br>
        <span>your workspace.</span>
    </h1>

    <!-- Login Form -->
    <form method="post">

        <!-- CSRF Protection -->
        <input
            type="hidden"
            name="csrf"
            value="{{ session.csrf }}"
        >

        <!-- Username Field -->
        <label>Username</label>

        <input
            type="text"
            name="username"
            required
            autocomplete="username"
        >

        <!-- Password Field -->
        <label>Password</label>

        <input
            type="password"
            name="password"
            required
            autocomplete="current-password"
        >

        <!-- Submit Button -->
        <button class="btn" type="submit">
            Sign in →
        </button>

    </form>

</section>

{% endblock %}
