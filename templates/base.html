<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Lockbox{% endblock %} | Secure Web App</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <!-- Header and Navigation -->
    <header>
        <a class="logo" href="/">
            LOCK<span>BOX</span>
        </a>

        <nav>
            <a href="/">Home</a>

            {% if session.get('uid') %}
                <a href="/dashboard">Dashboard</a>
            {% else %}
                <a href="/login">Login</a>
                <a href="/register">Register</a>
            {% endif %}
        </nav>
    </header>

    <!-- Main Content -->
    <main>

        <!-- Flash Messages -->
        {% with msgs = get_flashed_messages(with_categories=true) %}
            {% for cat, msg in msgs %}
                <p class="flash {{ cat }}">{{ msg }}</p>
            {% endfor %}
        {% endwith %}

        <!-- Page-Specific Content -->
        {% block content %}
        {% endblock %}

    </main>

    <!-- Footer -->
    <footer>
        LOCKBOX · SECURE WEB APPLICATION · LOCAL DEMO
    </footer>

</body>
</html>
